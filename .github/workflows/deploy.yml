name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'assets/**'
      - 'index.html'
      - '404.html'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure Vite entry index.html
        run: |
          cat > index.html << 'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <link rel="icon" type="image/png" href="/favicon.png" />
              <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
              <link rel="manifest" href="/manifest.webmanifest" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
              <meta name="theme-color" content="#0a0a0b" />
              <meta name="mobile-web-app-capable" content="yes" />
              <meta name="apple-mobile-web-app-capable" content="yes" />
              <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
              <meta name="apple-mobile-web-app-title" content="Kreatif" />
              <title>Kreatif</title>
              <link rel="preconnect" href="https://fonts.googleapis.com" />
              <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
              <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet" />
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.tsx"></script>
            </body>
          </html>
          HTML

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Add SPA 404 fallback
        run: cp dist/index.html dist/404.html

      # Repo Pages source is "legacy" (branch main /). Publish dist into the branch root
      # so kreatif-art.github.io actually serves the latest build.
      - name: Publish dist to branch root
        run: |
          set -e
          # Remove previous hashed bundles (keep public static files)
          rm -rf assets
          mkdir -p assets
          cp -R dist/assets/. assets/
          cp dist/index.html index.html
          cp dist/404.html 404.html
          # Public files from Vite public/ are already copied into dist by build
          for f in favicon.png favicon.svg apple-touch-icon.png icon-192.png icon-512.png logo.png manifest.webmanifest sw.js; do
            if [ -f "dist/$f" ]; then cp "dist/$f" "$f"; fi
          done
          if [ -d dist/fonts ]; then rm -rf fonts; cp -R dist/fonts fonts; fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html 404.html assets fonts favicon.png favicon.svg apple-touch-icon.png icon-192.png icon-512.png logo.png manifest.webmanifest sw.js || true
          if git diff --cached --quiet; then
            echo "No site asset changes to publish"
          else
            git commit -m "chore: publish production build [skip ci]"
            git push origin HEAD:main
          fi

      # Also upload Pages artifact (works if repo Pages source is switched to Actions later)
      - name: Setup Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: ./dist

  deploy-actions-pages:
    if: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-publish
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
