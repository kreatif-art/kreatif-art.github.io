name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'assets/**'
      - 'index.html'
      - '404.html'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Vite entry index.html
        run: |
          cat > index.html << 'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <link rel="icon" type="image/png" href="/favicon.png" />
              <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
              <link rel="manifest" href="/manifest.webmanifest" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
              <meta name="theme-color" content="#0a0a0b" />
              <meta name="mobile-web-app-capable" content="yes" />
              <meta name="apple-mobile-web-app-capable" content="yes" />
              <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
              <meta name="apple-mobile-web-app-title" content="Kreatif" />
              <title>Kreatif</title>
              <link rel="preconnect" href="https://fonts.googleapis.com" />
              <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
              <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet" />
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.tsx"></script>
            </body>
          </html>
          HTML

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          test -d dist/assets
          js=$(find dist/assets -name 'index-*.js' | head -1)
          css=$(find dist/assets -name 'index-*.css' | head -1)
          echo "JS=$js CSS=$css"
          test -n "$js" && test -s "$js"
          test -n "$css" && test -s "$css"
          test -f dist/index.html
          grep -q 'assets/index-' dist/index.html

      - name: Add SPA 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Publish dist to branch root
        run: |
          set -euo pipefail
          js_count=$(find dist/assets -name '*.js' | wc -l)
          if [ "$js_count" -lt 1 ]; then
            echo "Refusing to publish: no JS in dist/assets"
            exit 1
          fi

          # Replace hashed bundles atomically
          rm -rf assets
          mkdir -p assets
          cp -R dist/assets/. assets/
          cp dist/index.html index.html
          cp dist/404.html 404.html

          for f in favicon.png favicon.svg apple-touch-icon.png icon-192.png icon-512.png logo.png manifest.webmanifest sw.js; do
            if [ -f "dist/$f" ]; then cp "dist/$f" "$f"; fi
          done
          if [ -d dist/fonts ]; then rm -rf fonts; cp -R dist/fonts fonts; fi

          # Sanity: index must reference files that exist
          ref_js=$(grep -oE 'assets/index-[^"]+\.js' index.html | head -1)
          ref_css=$(grep -oE 'assets/index-[^"]+\.css' head -1 || true)
          ref_css=$(grep -oE 'assets/index-[^"]+\.css' index.html | head -1)
          test -f "$ref_js"
          test -f "$ref_css"
          echo "Published $ref_js ($(wc -c < "$ref_js") bytes) and $ref_css"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html 404.html assets fonts favicon.png favicon.svg apple-touch-icon.png icon-192.png icon-512.png logo.png manifest.webmanifest sw.js || true
          if git diff --cached --quiet; then
            echo "No site asset changes to publish"
          else
            git commit -m "chore: publish production build [skip ci]"
            git push origin HEAD:main
          fi
