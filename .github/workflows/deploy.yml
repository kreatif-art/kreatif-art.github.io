name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # no cache - force clean install

      - name: Verify HomePage source
        run: |
          echo "=== HomePage.tsx head ==="
          head -40 src/pages/HomePage.tsx
          echo "=== grep marker ==="
          grep -n "BUILD_MARKER_V2\|A space for original\|Where artists" src/pages/HomePage.tsx || true

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          echo "=== dist files ==="
          ls -la dist/
          ls -la dist/assets/ || true
          echo "=== search new copy in JS ==="
          grep -o "A space for original" dist/assets/*.js | head -3 || echo "NEW TEXT MISSING"
          grep -o "Where artists and fans connect" dist/assets/*.js | head -3 || echo "old text absent (good)"
          grep -o "BUILD_MARKER_V2" dist/assets/*.js | head -3 || echo "marker not in bundle (expected if stripped)"

      - name: Add SPA 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
